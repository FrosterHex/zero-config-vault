spring:
  application:
    name: secure-config-vault

  data:
    mongodb:
      uri: mongodb://localhost:27017/secure_config_vault
      database: secure_config_vault
      auto-index-creation: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha


# Application-specific configuration
vault:
  # Dev mode allows the published development master key and seeds the well-known dev API keys.
  # Enable it only locally, via the 'dev' profile (SPRING_PROFILES_ACTIVE=dev).
  dev-mode: false
  master:
    key: ${VAULT_MASTER_KEY:}
  bootstrap:
    # Optional: an ADMIN API key seeded on startup outside dev mode (e.g. for a fresh deployment)
    admin-key: ${VAULT_BOOTSTRAP_ADMIN_KEY:}
  api:
    header-name: X-API-Key
  cache:
    ttl: 300
  version:
    expiry-days: 90
  audit:
    cap-size-mb: 50
    max-documents: 10000
